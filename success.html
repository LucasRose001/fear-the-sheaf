<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Confirmed</title>
<meta name="robots" content="noindex">
<style>@font-face{font-family:"Bebas Neue";src:url(fonts/bebas.woff2) format("woff2")}@font-face{font-family:"Oswald";src:url(fonts/oswald.woff2) format("woff2");font-weight:200 700}@font-face{font-family:"Inter";src:url(fonts/inter.woff2) format("woff2");font-weight:100 900}</style>
<style>
:root{--bg:#0b0f12;--line:#263039;--gold:#c9a45c;--gold2:#e4c47f;--cream:#efe6d2;--muted:#9aa3a8}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--cream);font-family:'Inter',system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px 16px;text-align:center;
  background-image:radial-gradient(circle at 50% 35%,rgba(201,164,92,.16),transparent 55%)}
.box{max-width:520px}
img{width:150px;height:150px;border-radius:50%;object-fit:cover;border:1px solid #8e6f33;margin:0 auto 26px;display:block;animation:pop .8s cubic-bezier(.4,1.6,.5,1) both}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.eyebrow{font-family:'Oswald',sans-serif;letter-spacing:5px;text-transform:uppercase;color:var(--gold);font-size:13px}
h1{font-family:'Bebas Neue',Impact,sans-serif;font-size:clamp(56px,14vw,96px);line-height:.9;letter-spacing:1.5px;font-weight:400;margin:10px 0 18px}
p{color:var(--muted);font-size:17px;line-height:1.6}
a{display:inline-block;margin-top:32px;font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.16em;font-size:15px;padding:18px 32px;border-radius:999px;background:linear-gradient(135deg,#f0d394,#c9a45c 45%,#a8833f);color:#16120a;text-decoration:none;font-weight:600;box-shadow:0 10px 30px -10px rgba(201,164,92,.6);transition:transform .2s,box-shadow .3s}
a:hover{box-shadow:0 16px 40px -12px rgba(232,201,131,.75)}a:active{transform:scale(.97)}
small{display:block;margin-top:28px;color:#5d666c;font-family:'Oswald',sans-serif;letter-spacing:2px;text-transform:uppercase;font-size:12px}
</style>
</head>
<body>
<div class="box">
  <img src="img/emblem.jpg" alt="Fear the Sheaf">
  <div class="eyebrow">Payment received</div>
  <h1>You're Repping<br>the Sheaf.</h1>
  <p>Thanks for your order! A receipt is on its way to your email. We'll reach out by email or text when your gear is ready for pickup or on its way.</p>
  <a href="index.html">Back to the Shop</a>
  <small>Prairie Built · Athlete Driven · <a href="policies.html" style="all:unset;cursor:pointer;color:#9aa3a8;text-decoration:underline">Policies</a></small>
</div>
<script>try{localStorage.removeItem("fts_cart")}catch(e){}</script>
</body>
</html>
